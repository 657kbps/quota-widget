name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (tests, lint, detekt, release assembly)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :shared:allTests

      - name: Run detekt and source-file limits
        run: ./gradlew :shared:detekt :androidApp:detekt verifyMaxFileLines

      - name: Run Android lint
        run: ./gradlew :androidApp:lintDebug

      - name: Assemble release with R8 (debug signing)
        run: ./gradlew :androidApp:assembleRelease -PallowDebugReleaseSigning=true

  landing:
    name: Landing (typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: landing
        run: pnpm typecheck

      - name: Test
        working-directory: landing
        run: pnpm test
